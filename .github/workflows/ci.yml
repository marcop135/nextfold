name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, types, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Check the changelog format
        run: npm run changelog:lint

      - name: Check seed content against the schema rules
        run: npm run content:check

      - name: Check generated Sanity types
        run: |
          npm run typegen
          git diff --exit-code -- src/sanity/schema.json src/sanity/sanity.types.ts || {
            echo "::error::Sanity types are out of date. Run npm run typegen and commit the result."
            exit 1
          }
        env:
          # Schema extraction loads sanity.config.ts, which needs a project ID; no API call is made.
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          SANITY_TELEMETRY_DISABLED: "1"

      - name: Build
        # No Sanity env: pages render from the seed content in src/content/seed.
        run: npm run build

      - name: End-to-end and accessibility tests
        # Starts npm start on the build above and runs in the runner's preinstalled Chrome.
        run: npm run test:e2e

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
